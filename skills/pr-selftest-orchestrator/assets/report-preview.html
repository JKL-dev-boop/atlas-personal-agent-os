<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PR Self-Test Report</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f7fb;--panel:#fff;--text:#162033;--muted:#64748b;--line:#dbe4ef;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--amber:#b45309;--slate:#475569;--shadow:0 14px 40px rgba(15,23,42,.08)}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1120;--panel:#111a2e;--text:#e5edf8;--muted:#9aabc1;--line:#263551;--blue:#60a5fa;--green:#4ade80;--red:#fb7185;--amber:#fbbf24;--slate:#cbd5e1;--shadow:none}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:32px 20px 64px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#172554,#0f766e);color:#fff;padding:28px;border-radius:22px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-130px;background:rgba(255,255,255,.12)}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.72}.hero h1{margin:6px 0 4px;font-size:30px;line-height:1.2}.hero p{margin:0;max-width:820px;opacity:.86}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.13);font-size:12px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:18px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}.metric .n{font-size:27px;font-weight:750}.metric .l{color:var(--muted);font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-top:16px;padding:20px;box-shadow:var(--shadow)}.panel h2{font-size:17px;margin:0 0 14px}.decision{display:flex;gap:14px;align-items:flex-start}.decision .badge{font-size:13px;font-weight:750;padding:6px 10px;border-radius:9px}.PASS{color:var(--green)}.FAIL,.BLOCK{color:var(--red)}.BLOCKED,.REVIEW,.MANUAL_REVIEW{color:var(--amber)}.SKIPPED,.ERROR,.UNKNOWN{color:var(--slate)}.badge.PASS{background:color-mix(in srgb,var(--green) 14%,transparent)}.badge.BLOCK,.badge.FAIL{background:color-mix(in srgb,var(--red) 14%,transparent)}.badge.REVIEW{background:color-mix(in srgb,var(--amber) 16%,transparent)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.filter{border:1px solid var(--line);background:transparent;color:var(--text);padding:6px 10px;border-radius:9px;cursor:pointer}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;font-weight:650}.table-wrap{overflow:auto}.case{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:10px}.case-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.case-title{font-weight:720}.case-meta{color:var(--muted);font-size:12px;margin-top:3px}.status{font-weight:800;font-size:12px}.assertions{margin:10px 0 0;padding-left:20px}.diagnosis{margin-top:12px;padding:12px;border-left:4px solid var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent);border-radius:8px}.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.evidence-card{border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0}.evidence-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.evidence-type{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}.evidence-path{display:block;margin-top:8px;overflow-wrap:anywhere}.hash{display:block;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.learning{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.learn-card{border:1px solid var(--line);border-radius:12px;padding:13px}.muted{color:var(--muted)}a{color:var(--blue)}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}details{margin-top:8px}summary{cursor:pointer;color:var(--blue)}.empty{color:var(--muted);font-style:italic}.footer{color:var(--muted);text-align:center;margin-top:28px;font-size:12px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.learning,.evidence-grid{grid-template-columns:1fr}}
    @media(max-width:560px){main{padding:16px 10px 36px}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:22px}.hero h1{font-size:24px}}
    @media print{body{background:#fff}.hero,.panel,.metric{box-shadow:none}.toolbar{display:none}details{display:block}details>*{display:block}.panel{break-inside:avoid}}
  </style>
</head>
<body>
<main id="app"></main>
<script>
const data={"run_id":"run-20260928-001","pr":{"title":"Add container quota validation","url":"https://example.internal/pull/123","head_sha":"a1b2c3d"},"environment":"integration-test-a","started_at":"2026-09-28T09:30:00+08:00","duration_seconds":146,"recommendation":{"status":"BLOCK","summary":"One P0 state-transition case failed. Hold merge until the callback path is fixed and TC-003 turns green."},"summary":{"passed":4,"failed":1,"blocked":0,"skipped":1,"manual_review":0,"cleanup":"PASS"},"coverage":[{"source":"PR diff: quota validation","risk":"invalid quota may be accepted","case_id":"TC-002","assertion":"QUOTA_INVALID is returned","status":"PASS"},{"source":"PR diff: async callback branch","risk":"resource may remain UPDATING","case_id":"TC-003","assertion":"resource returns to RUNNING within 60s","status":"FAIL"}],"cases":[{"id":"TC-002","title":"Reject an invalid quota","status":"PASS","source":"PR diff","duration_seconds":4,"assertions":["HTTP 400","code=QUOTA_INVALID"],"details":"The response and stored state both matched the expected rejection.","evidence_refs":["EV-TC-002-REQUEST","EV-TC-002-DB-DIFF"],"diagnosis":null},{"id":"TC-003","title":"Recover after quota update","status":"FAIL","source":"PR diff and verified runbook RB-018","duration_seconds":68,"assertions":["HTTP 202","status becomes RUNNING within 60s"],"details":"The resource stayed in UPDATING. Cleanup completed successfully.","evidence_refs":["EV-TC-003-LOG","EV-TC-003-DB-DIFF","EV-TC-003-CLEANUP"],"diagnosis":{"classification":"PRODUCT_DEFECT","confidence":"high","summary":"Miracle-Ops found that the error callback was not persisted after the new quota branch.","evidence":["trace=req-89b","scheduler log event callback_persist skipped","Runbook RB-018"]}}],"evidence":[{"id":"EV-TC-002-REQUEST","case_id":"TC-002","type":"request_response","source":"quota-api","summary":"HTTP 400 with QUOTA_INVALID; sensitive headers excluded","path":"evidence/TC-002/requests/update-quota.json","sha256":"3b57dbd7e42d09cbe4e4f5607ff8d901c5077df4cd985a86e6277605f33a5f9a","captured_at":"2026-09-28T01:30:04Z","metadata":{"request_id":"req-72a"}},{"id":"EV-TC-002-DB-DIFF","case_id":"TC-002","type":"db_diff","source":"quota-state","summary":"Rejected request caused no persisted state change","path":"evidence/TC-002/db/diff/quota-state-diff.json","sha256":"67b9f41094e867c33f00b7542e52c68021b38ca12b35198caeb992b01131aaf4","captured_at":"2026-09-28T01:30:05Z","metadata":{"added":0,"removed":0,"changed":0}},{"id":"EV-TC-003-LOG","case_id":"TC-003","type":"log_context","source":"scheduler-service","summary":"Trace-bounded log context shows callback_persist was skipped","path":"evidence/TC-003/logs/scheduler-trace-req-89b.log","sha256":"993d6249b168a42687da20ef4bfe65ab8cc57f773e12811c6132540bbf9f5f73","captured_at":"2026-09-28T01:31:12Z","metadata":{"lines":84,"trace_id":"req-89b","truncated":false}},{"id":"EV-TC-003-DB-DIFF","case_id":"TC-003","type":"db_diff","source":"resource-state","summary":"Resource status changed RUNNING → UPDATING and did not recover","path":"evidence/TC-003/db/diff/resource-state-diff.json","sha256":"b591e360058612e40b5249be84a87016f9f4a623f7d6e3d2dfa1c2e08da7769c","captured_at":"2026-09-28T01:31:13Z","metadata":{"added":0,"removed":0,"changed":2}},{"id":"EV-TC-003-CLEANUP","case_id":"TC-003","type":"db_cleanup","source":"resource-state","summary":"Cleanup verification found no orphaned self-test resource","path":"evidence/TC-003/db/cleanup/resource-state.json","sha256":"12805b0314440949d44d8cd3dd2c697d6de169e2d2b14ef9ca97afa2a69c44a4","captured_at":"2026-09-28T01:31:16Z","metadata":{"rows":0}}],"learning":[{"id":"RB-CAND-021","title":"Quota callback remains UPDATING","status":"candidate","confidence":"medium","scope":"scheduler 3.2.x / integration test"}],"artifacts":[{"label":"Approved plan","path":"approved-plan.json"},{"label":"Miracle-Ops diagnosis","path":"artifacts/miracle-ops-TC-003.json"}]};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const safeHref=v=>{const s=String(v??"");return /^(?:[A-Za-z][A-Za-z0-9+.-]*:|\/\/)/.test(s)&&!/^https?:/i.test(s)?"#":esc(s)};
const statusLabel=s=>({PASS:"✓ PASS",FAIL:"✕ FAIL",BLOCK:"✕ BLOCK",BLOCKED:"! BLOCKED",SKIPPED:"– SKIPPED",MANUAL_REVIEW:"? MANUAL",ERROR:"! ERROR",REVIEW:"? REVIEW",UNKNOWN:"? UNKNOWN"}[s]||esc(s||"UNKNOWN"));
const list=v=>(Array.isArray(v)?v:[]);
const summary=data.summary||{};
const recommendation=data.recommendation||{status:"REVIEW",summary:"No recommendation recorded."};
const cases=list(data.cases);
const metrics=[
  [summary.passed??0,"Passed"],[summary.failed??0,"Failed"],[summary.blocked??0,"Blocked"],
  [summary.skipped??0,"Skipped"],[summary.manual_review??0,"Manual"],[`${data.duration_seconds??0}s`,"Duration"]
];
const diagnosisHtml=d=>d?`<div class="diagnosis"><strong>Miracle-Ops diagnosis</strong><div>${esc(d.summary||d.root_cause||"No summary")}</div><div class="muted">Classification: ${esc(d.classification||"UNKNOWN")} · Confidence: ${esc(d.confidence||"unknown")}</div>${list(d.evidence).length?`<details><summary>Evidence</summary><ul>${list(d.evidence).map(x=>`<li>${esc(typeof x==="string"?x:JSON.stringify(x))}</li>`).join("")}</ul></details>`:""}</div>`:"";
const evidenceHtml=e=>{const meta=e.metadata&&typeof e.metadata==="object"?e.metadata:{};const counts=["added","removed","changed"].filter(k=>meta[k]!==undefined).map(k=>`${k} ${meta[k]}`).join(" · ");return `<article class="evidence-card"><div class="evidence-head"><div><strong>${esc(e.case_id||"RUN")} · ${esc(e.source||"unknown source")}</strong><div class="evidence-type">${esc(e.type||"evidence")}</div></div><span class="muted">${esc(e.captured_at||"")}</span></div><div>${esc(e.summary||counts||"Captured evidence")}</div>${counts&&e.summary?`<div class="muted">${esc(counts)}</div>`:""}<a class="evidence-path" href="${safeHref(e.path)}">${esc(e.path||"Open evidence")}</a><code class="hash">SHA-256 ${esc(e.sha256||"not recorded")}</code></article>`};
document.querySelector("#app").innerHTML=`
  <section class="hero"><div class="eyebrow">PR Self-Test Report</div><h1>${esc(data.pr?.title||"Untitled PR")}</h1><p>${esc(recommendation.summary)}</p><div class="meta"><span class="chip">Run ${esc(data.run_id)}</span><span class="chip">Env ${esc(data.environment)}</span><span class="chip">SHA ${esc(data.pr?.head_sha)}</span><span class="chip">Cleanup ${esc(summary.cleanup||"UNKNOWN")}</span></div></section>
  <section class="grid">${metrics.map(([n,l])=>`<div class="metric"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("")}</section>
  <section class="panel"><h2>Decision</h2><div class="decision"><span class="badge ${esc(recommendation.status)}">${statusLabel(recommendation.status)}</span><div>${esc(recommendation.summary)}</div></div></section>
  <section class="panel"><h2>Traceability matrix</h2><div class="table-wrap"><table><thead><tr><th>PR source</th><th>Risk</th><th>Case</th><th>Oracle</th><th>Result</th></tr></thead><tbody>${list(data.coverage).map(r=>`<tr><td>${esc(r.source)}</td><td>${esc(r.risk)}</td><td>${esc(r.case_id)}</td><td>${esc(r.assertion)}</td><td class="${esc(r.status)}">${statusLabel(r.status)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No coverage data.</td></tr>`}</tbody></table></div></section>
  <section class="panel"><h2>Test cases</h2><div class="toolbar"><button class="filter active" data-filter="ALL">All</button>${["PASS","FAIL","BLOCKED","SKIPPED","MANUAL_REVIEW","ERROR"].map(s=>`<button class="filter" data-filter="${s}">${s}</button>`).join("")}</div><div id="cases">${cases.map(c=>`<article class="case" data-status="${esc(c.status)}"><div class="case-head"><div><div class="case-title">${esc(c.id)} · ${esc(c.title)}</div><div class="case-meta">${esc(c.source||"")} · ${esc(c.duration_seconds??0)}s</div></div><span class="status ${esc(c.status)}">${statusLabel(c.status)}</span></div>${list(c.assertions).length?`<ul class="assertions">${list(c.assertions).map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}${c.details?`<details><summary>Details</summary><div>${esc(c.details)}</div></details>`:""}${diagnosisHtml(c.diagnosis)}</article>`).join("")||`<p class="empty">No case results.</p>`}</div></section>
  <section class="panel"><h2>Evidence</h2><div class="evidence-grid">${list(data.evidence).map(evidenceHtml).join("")||`<p class="empty">No evidence indexed.</p>`}</div></section>
  <section class="panel"><h2>Learned runbooks</h2><div class="learning">${list(data.learning).map(x=>`<div class="learn-card"><strong>${esc(x.id)} · ${esc(x.title)}</strong><div class="muted">${esc(x.status)} · confidence ${esc(x.confidence)} · ${esc(x.scope)}</div></div>`).join("")||`<p class="empty">No new runbook candidates.</p>`}</div></section>
  <section class="panel"><h2>Artifacts</h2><ul>${list(data.artifacts).map(a=>`<li><a href="${safeHref(a.path)}">${esc(a.label||a.path)}</a></li>`).join("")||`<li class="empty">No artifacts listed.</li>`}</ul></section>
  <div class="footer">Generated by PR Self-Test Orchestrator · ${esc(data.started_at||"")}</div>`;
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");const f=b.dataset.filter;document.querySelectorAll(".case").forEach(c=>c.hidden=f!=="ALL"&&c.dataset.status!==f)}));
</script>
</body>
</html>
